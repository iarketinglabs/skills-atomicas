<!doctype html>
<html lang="$lang">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>$title</title>
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <main id="viewport"><div id="stage">$slides</div></main>

</html>
